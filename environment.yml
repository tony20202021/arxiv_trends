# Имя окружения задаётся через переменную CONDA_ENV в .env
# и передаётся флагом -n при создании: conda env create -f environment.yml -n "$CONDA_ENV"
name: conda_arxive_trends
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - conda-forge::spacy=3.7
  - pip:
      - -r requirements.txt
# MongoDB устанавливается отдельно через apt (не через conda):
# https://www.mongodb.org/static/pgp/server-7.0.asc
      